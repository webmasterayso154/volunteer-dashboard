<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AYSO 154 | Spring Volunteer Tracker</title>
  <style>
    :root {
      --ayso-blue: #0033a0;
      --bg-color: #f4f7f6;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: #333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border-top: 8px solid var(--ayso-blue);
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .header h1 {
      color: var(--ayso-blue);
      margin: 0 0 5px 0;
      font-size: 2em;
    }
    .header p {
      color: #666;
      margin: 0;
      font-size: 1.1em;
    }
    .tracker-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      margin-bottom: 12px;
      background: #fff;
      border: 1px solid #eaeaea;
      border-radius: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .tracker-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }
    .team-info {
      display: flex;
      flex-direction: column;
    }
    .team-name {
      font-weight: bold;
      font-size: 1.2em;
      color: #222;
    }
    .fm-status {
      font-size: 0.9em;
      color: #666;
      margin-top: 4px;
    }
    .status-badge {
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.95em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .earned {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .pending {
      background-color: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }
    .loader {
      text-align: center;
      padding: 30px;
      color: #777;
      font-style: italic;
    }
    @media (max-width: 500px) {
      .tracker-card { flex-direction: column; align-items: flex-start; gap: 10px; }
      .status-badge { align-self: flex-start; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🍕 Spring Pizza Tracker</h1>
      <p>Complete your Field Marshal shift to earn the end-of-season party!</p>
    </div>
    
    <div id="loader" class="loader">Fetching the latest field reports...</div>
    
    <div id="trackerList" style="display: none;">
      </div>
  </div>

  <script>
    // ⚠️ IMPORTANT: Paste your published Google Apps Script Web App URL here!
    const WEB_APP_URL = 'YOUR_GOOGLE_WEB_APP_URL_HERE';

    window.onload = async function() {
      try {
        const response = await fetch(WEB_APP_URL);
        const data = await response.json();

        if (data.error) {
          document.getElementById('loader').innerText = "❌ " + data.error;
          return;
        }

        const trackerList = document.getElementById('trackerList');
        
        data.forEach(row => {
          if (row['Team Name']) {
            const fmPoints = Number(row['FM Points (2 per shift)']) || 0;
            const hasPizza = row['Pizza Eligible'] ? true : false;
            
            // Visual logic: If they have Pizza Eligible, or if FM points are high enough
            let statusHTML = '';
            if (hasPizza || fmPoints > 0) {
              statusHTML = `<div class="status-badge earned">🍕 Party Earned!</div>`;
            } else {
              statusHTML = `<div class="status-badge pending">⏳ Shift Pending</div>`;
            }

            const card = document.createElement('div');
            card.className = 'tracker-card';
            card.innerHTML = `
              <div class="team-info">
                <span class="team-name">${row['Team Name']}</span>
              </div>
              ${statusHTML}
            `;
            trackerList.appendChild(card);
          }
        });

        document.getElementById('loader').style.display = 'none';
        trackerList.style.display = 'block';

      } catch (error) {
        document.getElementById('loader').innerText = "❌ Failed to load. Please try again later.";
      }
    };
  </script>
</body>
</html>
